[project]
name = "oraxes"
version = "0.1.0"
description = "A terminal-operated, citation-backed web research agent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "google-genai>=1.0.0",
  "httpx>=0.28.1",
  "playwright>=1.52.0",
  "pydantic>=2.10.0",
  "python-dotenv>=1.0.1",
  "rich>=13.9.0",
  "typer>=0.15.1",
]

[project.scripts]
oraxes = "oraxes.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.0",
  "ty>=0.0.1a21",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: tests that compose multiple project layers",
  "e2e: browser-backed end-to-end tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ty.environment]
python-version = "3.12"
